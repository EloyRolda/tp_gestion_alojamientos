<section class="stack login">
  <h1>Iniciar sesion</h1>

  <form class="stack" (submit)="$event.preventDefault(); enviar()">
    <div class="field">
      <label for="identificador">Email, usuario o telefono</label>
      <input
        id="identificador"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        required
        [ngModel]="identificador()"
        (ngModelChange)="identificador.set($event)"
        name="identificador"
      />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        name="password"
      />
    </div>

    @if (error()) {
      <p class="text-danger">{{ error() }}</p>
    }

    <button type="submit" class="btn btn--primario" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="text-muted">¿No tenes cuenta? <a routerLink="/registro">Registrarte</a></p>
  <p class="text-muted"><a routerLink="/verificar-cuenta">¿Necesitas verificar tu cuenta?</a></p>
</section>
