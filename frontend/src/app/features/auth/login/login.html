<section class="stack login">
  <h1>Iniciar sesión</h1>

  <form class="stack" (submit)="$event.preventDefault(); enviar()">
    <div class="field">
      <label for="identificador">Email, usuario o teléfono</label>
      <input
        id="identificador"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        required
        [ngModel]="identificador()"
        (ngModelChange)="identificador.set($event); errores.set({})"
        name="identificador"
        [attr.aria-invalid]="errores()['identificador'] ? true : null" [attr.aria-describedby]="errores()['identificador'] ? 'identificador-error' : null"
      />
      <app-error-campo campo="identificador" [mensaje]="errores()['identificador']" />
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event); errores.set({})"
        name="password"
        [attr.aria-invalid]="errores()['password'] ? true : null" [attr.aria-describedby]="errores()['password'] ? 'password-error' : null"
      />
      <app-error-campo campo="password" [mensaje]="errores()['password']" />
    </div>

    @if (error()) {
      <p class="text-danger">{{ error() }}</p>
    }

    <button type="submit" class="btn btn--primario" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>

  <p class="text-muted">¿No tenés cuenta? <a routerLink="/registro">Registrarte</a></p>
  <p class="text-muted"><a routerLink="/verificar-cuenta">¿Necesitás verificar tu cuenta?</a></p>
</section>
