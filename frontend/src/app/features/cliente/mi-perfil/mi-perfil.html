<section class="stack mi-perfil">
  <h1>Mi perfil</h1>

  @if (cargando()) {
    <p>Cargando...</p>
  } @else {
    <form class="stack" (submit)="$event.preventDefault(); guardar()">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" required [ngModel]="form().nombre" (ngModelChange)="actualizarCampo('nombre', $event)" name="nombre" />
      </div>
      <div class="field">
        <label for="apellido">Apellido</label>
        <input id="apellido" type="text" required [ngModel]="form().apellido" (ngModelChange)="actualizarCampo('apellido', $event)" name="apellido" />
      </div>
      <div class="field">
        <label for="usuarioLogin">Usuario</label>
        <input id="usuarioLogin" type="text" required [ngModel]="form().usuarioLogin" (ngModelChange)="actualizarCampo('usuarioLogin', $event)" name="usuarioLogin" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required [ngModel]="form().email" (ngModelChange)="actualizarCampo('email', $event)" name="email" />
      </div>
      <div class="field">
        <label for="telefono">Telefono</label>
        <input id="telefono" type="tel" required [ngModel]="form().telefono" (ngModelChange)="actualizarCampo('telefono', $event)" name="telefono" />
      </div>
      <div class="field">
        <label for="password">Nueva contraseña (opcional)</label>
        <input id="password" type="password" minlength="6" placeholder="Dejar en blanco para no cambiarla" [ngModel]="form().password" (ngModelChange)="actualizarCampo('password', $event)" name="password" />
      </div>

      @if (error()) {
        <p class="text-danger">{{ error() }}</p>
      }
      @if (exito()) {
        <p class="card">Datos actualizados correctamente.</p>
      }

      <button type="submit" class="btn" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  }
</section>
