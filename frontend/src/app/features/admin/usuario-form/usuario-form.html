<section class="stack usuario-form">
  <a routerLink="/admin/usuarios" class="text-muted">&larr; Volver a gestion de usuarios</a>

  @if (cargando()) {
    <app-esqueleto tipo="formulario" [cantidad]="4" />
  } @else if (!form()) {
    <p class="text-danger">{{ error() }}</p>
  } @else {
    <h1>Editar usuario ({{ tipo() }})</h1>

    <form class="stack" (submit)="$event.preventDefault(); guardar()">
      <div class="form-grid">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input id="nombre" autocomplete="off" type="text" required [ngModel]="form()!.nombre" (ngModelChange)="actualizarCampo('nombre', $event)" name="nombre" />
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input id="apellido" autocomplete="off" type="text" required [ngModel]="form()!.apellido" (ngModelChange)="actualizarCampo('apellido', $event)" name="apellido" />
        </div>
        <div class="field">
          <label for="usuarioLogin">Usuario</label>
          <input id="usuarioLogin" autocomplete="off" type="text" required [ngModel]="form()!.usuarioLogin" (ngModelChange)="actualizarCampo('usuarioLogin', $event)" name="usuarioLogin" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" autocomplete="off" type="email" required [ngModel]="form()!.email" (ngModelChange)="actualizarCampo('email', $event)" name="email" />
        </div>
        <div class="field">
          <label for="telefono">Telefono</label>
          <input id="telefono" autocomplete="off" type="tel" required [ngModel]="form()!.telefono" (ngModelChange)="actualizarCampo('telefono', $event)" name="telefono" />
        </div>
        <div class="field">
          <label for="password">Nueva contraseña (opcional)</label>
          <input id="password" autocomplete="new-password" type="password" minlength="6" placeholder="Dejar en blanco para no cambiarla" [ngModel]="form()!.password" (ngModelChange)="actualizarCampo('password', $event)" name="password" />
        </div>
      </div>
      <label>
        <input type="checkbox" [checked]="form()!.activo" (change)="actualizarCampo('activo', !form()!.activo)" />
        Cuenta activa
      </label>

      @if (error()) {
        <p class="text-danger">{{ error() }}</p>
      }
      @if (exito()) {
        <p class="card">Usuario actualizado correctamente.</p>
      }

      <button type="submit" class="btn btn--primario" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </form>
  }
</section>
