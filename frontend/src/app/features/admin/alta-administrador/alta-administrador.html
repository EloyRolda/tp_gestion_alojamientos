<section class="stack alta-administrador">
  <a routerLink="/admin/usuarios" class="text-muted">&larr; Volver a gestion de usuarios</a>
  <h1>Crear administrador</h1>

  @if (exito()) {
    <p class="card">Administrador creado correctamente, ya puede iniciar sesión.</p>
  }

  <form class="stack" (submit)="$event.preventDefault(); enviar()">
    <div class="form-grid">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" autocomplete="off" type="text" required [ngModel]="form().nombre" (ngModelChange)="actualizarCampo('nombre', $event)" name="nombre" [attr.aria-invalid]="errores()['nombre'] ? true : null" [attr.aria-describedby]="errores()['nombre'] ? 'nombre-error' : null" />
        <app-error-campo campo="nombre" [mensaje]="errores()['nombre']" />
      </div>
      <div class="field">
        <label for="apellido">Apellido</label>
        <input id="apellido" autocomplete="off" type="text" required [ngModel]="form().apellido" (ngModelChange)="actualizarCampo('apellido', $event)" name="apellido" [attr.aria-invalid]="errores()['apellido'] ? true : null" [attr.aria-describedby]="errores()['apellido'] ? 'apellido-error' : null" />
        <app-error-campo campo="apellido" [mensaje]="errores()['apellido']" />
      </div>
      <div class="field">
        <label for="usuarioLogin">Usuario</label>
        <input id="usuarioLogin" autocomplete="off" type="text" required [ngModel]="form().usuarioLogin" (ngModelChange)="actualizarCampo('usuarioLogin', $event)" name="usuarioLogin" [attr.aria-invalid]="errores()['usuarioLogin'] ? true : null" [attr.aria-describedby]="errores()['usuarioLogin'] ? 'usuarioLogin-error' : null" />
        <app-error-campo campo="usuarioLogin" [mensaje]="errores()['usuarioLogin']" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" autocomplete="off" type="email" required [ngModel]="form().email" (ngModelChange)="actualizarCampo('email', $event)" name="email" [attr.aria-invalid]="errores()['email'] ? true : null" [attr.aria-describedby]="errores()['email'] ? 'email-error' : null" />
        <app-error-campo campo="email" [mensaje]="errores()['email']" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" autocomplete="new-password" type="password" required minlength="6" [ngModel]="form().password" (ngModelChange)="actualizarCampo('password', $event)" name="password" [attr.aria-invalid]="errores()['password'] ? true : null" [attr.aria-describedby]="errores()['password'] ? 'password-error' : null" />
        <app-error-campo campo="password" [mensaje]="errores()['password']" />
      </div>
      <div class="field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" autocomplete="off" type="tel" required [ngModel]="form().telefono" (ngModelChange)="actualizarCampo('telefono', $event)" name="telefono" [attr.aria-invalid]="errores()['telefono'] ? true : null" [attr.aria-describedby]="errores()['telefono'] ? 'telefono-error' : null" />
        <app-error-campo campo="telefono" [mensaje]="errores()['telefono']" />
      </div>
    </div>

    @if (error()) {
      <p class="text-danger">{{ error() }}</p>
    }

    <button type="submit" class="btn btn--primario" [disabled]="enviando()">
      {{ enviando() ? 'Creando...' : 'Crear administrador' }}
    </button>
  </form>
</section>
