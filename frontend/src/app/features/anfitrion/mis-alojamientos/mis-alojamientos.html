<section class="stack">
  <div class="page-header">
    <h1>Mis alojamientos</h1>
    <a routerLink="/anfitrion/alojamientos/nuevo" class="btn btn--primario">Publicar alojamiento</a>
  </div>

  @if (cargando()) {
    <p>Cargando...</p>
  } @else if (error()) {
    <p class="text-danger">{{ error() }}</p>
  } @else if (alojamientos().length === 0) {
    <p class="text-muted">Todavia no publicaste ningun alojamiento.</p>
  } @else {
    <div class="grid-auto">
      @for (a of alojamientos(); track a.idAlojamiento) {
        <app-alojamiento-card [alojamiento]="a" [aviso]="a.activo ? null : 'Inactivo'">
          <div acciones class="acciones-fila">
            <a [routerLink]="['/anfitrion/alojamientos', a.idAlojamiento, 'editar']" class="btn">Editar</a>
            <a [routerLink]="['/anfitrion/alojamientos', a.idAlojamiento, 'galeria']" class="btn">Galería</a>
            <button type="button" class="btn" [class.btn--peligro]="a.activo" (click)="toggleActivo(a)" [disabled]="cambiandoEstado() === a.idAlojamiento">
              {{ a.activo ? 'Desactivar' : 'Activar' }}
            </button>
          </div>
        </app-alojamiento-card>
      }
    </div>
  }
</section>
