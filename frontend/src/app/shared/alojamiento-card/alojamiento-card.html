<a [routerLink]="['/alojamientos', alojamiento().idAlojamiento]" class="card alojamiento-card">
  <h3>{{ alojamiento().titulo }}</h3>
  <p class="text-muted">
    {{ alojamiento().direccion.ciudad }}, {{ alojamiento().direccion.provincia }}
  </p>
  <p class="text-muted">{{ alojamiento().tipoAlojamiento.nombreTipo }} &middot; hasta {{ alojamiento().capacidad }} huespedes</p>
  <p class="alojamiento-card__precio">${{ alojamiento().precioNoche | number }} <span class="text-muted">/ noche</span></p>
</a>
