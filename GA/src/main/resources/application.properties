spring.application.name=tp-final-alojamiento

# Configuración de la base de datos MySQL. Host/puerto/nombre tienen default
# de desarrollo local; usuario/password NO: se exige la variable de entorno
# (sin valor por defecto) para no tener una credencial de DB, aunque sea
# "root sin password", resuelta en texto plano dentro del repo.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:testdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración para subida de archivos (Cloudinary / Multipart)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de Cloudinary. Las 3 son credenciales de la cuenta — sin
# default: tienen que venir siempre por variable de entorno.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Configuración de JWT. jwt.secret es la clave con la que se firman TODOS los
# tokens: si se filtra, cualquiera puede emitir un JWT valido para cualquier
# usuario. Sin default — tiene que venir por variable de entorno, generada
# para cada entorno (ej: openssl rand -hex 32).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuración de Brevo (envío de correos transaccionales, verificación de cuenta)
brevo.api-key=${BREVO_API_KEY}
brevo.remitente.email=${BREVO_REMITENTE_EMAIL:no-reply@eloyroldan.com.ar}
brevo.remitente.nombre=${BREVO_REMITENTE_NOMBRE:AlojaME}

# URL base del frontend Angular (links de verificación de mail, back_urls de MercadoPago, etc.)
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Origenes permitidos para CORS (separados por coma si hay mas de uno: staging
# + produccion, por ej). Por defecto, solo el frontend configurado arriba —
# nunca "*", que combinado con credentials=true (necesario para mandar el JWT)
# le abriria la API a cualquier sitio externo desde el browser del usuario.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url}}

# ============================================================
# Configuración de MercadoPago (sistema de pagos)
# ============================================================
# Access Token de la cuenta vendedora. Sin default: nunca debe haber una
# credencial real (de prueba o de produccion) resuelta en el repo. Usar un
# token que empiece con "TEST-" para no mover plata real en desarrollo.
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}

# true mientras uses credenciales de prueba (agrega el header X-test-token que
# pide la API de Payouts en sandbox). Poner en false al pasar a producción.
mercadopago.modo-prueba=${MERCADOPAGO_MODO_PRUEBA:true}

# URL pública a la que MercadoPago manda las notificaciones de pago (webhook).
# En local hace falta un túnel (ngrok) para que esto sea alcanzable desde afuera;
# mientras no lo tengas armado, el webhook simplemente no va a llegar (podés
# simular la confirmación a mano desde la consola de pruebas).
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8081/Pago/webhook}

# Comisión de la plataforma (tu 5%) y estimación de la comisión propia de
# MercadoPago (varía según medio de pago; esto es una aproximación para el
# cálculo previo que ve el cliente, no el valor exacto que cobra MercadoPago).
# No son secretos, pero quedan overrideables por entorno igual (ej: ajustar la
# comisión en producción sin tocar código).
pago.comision-plataforma-porcentaje=${PAGO_COMISION_PLATAFORMA_PORCENTAJE:5}
pago.comision-mercadopago-estimada-porcentaje=${PAGO_COMISION_MERCADOPAGO_ESTIMADA_PORCENTAJE:6}

# Porcentaje del monto base que se retiene para el anfitrion cuando el cliente
# cancela con menos de 48hs de anticipacion (ver Service/Cancelacion/RetencionTardiaPolicy).
pago.porcentaje-retencion-tardia=${PAGO_PORCENTAJE_RETENCION_TARDIA:0.35}

# Cada cuánto corre el job que cancela reservas CONFIRMADA sin pagar tras 48hs
# (en milisegundos). 600000 = 10 minutos. Bajalo (ej: 60000 = 1 min) mientras
# estés probando, así no tenés que esperar tanto para ver el auto-cancelado.
pago.job.vencimiento-fixed-rate-ms=${PAGO_JOB_VENCIMIENTO_FIXED_RATE_MS:600000}

server.port=${SERVER_PORT:8081}

# Para que rutas inexistentes (ej: un typo en la URL desde el front) devuelvan
# un JSON prolijo via GlobalExceptionHandler en vez de la pagina HTML por
# defecto de Spring. No afecta a "/", "/error" ni al resto de las rutas reales.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ============================================================
# Micrometer / Actuator (observabilidad operativa — no confundir con las
# consultas analiticas de negocio, que estan en /Estadisticas)
# ============================================================
# Expone /actuator/health (estado de la app) y /actuator/prometheus (metricas
# en formato que puede scrapear Prometheus/Grafana, incluye los contadores
# "reservas.creadas", "pagos.procesados" y el timer "mercadopago.crear_preferencia"
# que se agregaron en ReservaService/PagoService).
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
