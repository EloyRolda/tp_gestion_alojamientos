<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del alojamiento</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; }
        img { width: 140px; height: 140px; object-fit: cover; margin: 4px; }
        dt { font-weight: bold; margin-top: 6px; }
        .review { border: 1px solid #ccc; padding: 8px; margin-bottom: 6px; }
    </style>
</head>
<body>
<p><a href="/listar-alojamientos.html">Volver al listado</a></p>
<h1 id="titulo">Cargando...</h1>

<dl id="datos"></dl>

<h2>Amenities</h2>
<ul id="amenities"></ul>

<h2>Fotos</h2>
<div id="galeria"></div>

<div id="acciones"></div>
<p><a href="/reportar.html?tipo=alojamiento&id=" id="linkReportar">Reportar este alojamiento</a></p>

<h2>Reviews</h2>
<div id="reviews"></div>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    const id = new URLSearchParams(location.search).get("id");
    let usuario, alojamiento;

    async function cargar() {
        usuario = await apiJson("/Usuario/me");
        alojamiento = await apiJson("/Alojamiento/mostrar/" + id);

        document.getElementById("titulo").textContent = alojamiento.titulo;
        document.getElementById("linkReportar").href = `/reportar.html?tipo=alojamiento&id=${id}`;

        const dir = alojamiento.direccion;
        const filas = [
            ["Tipo", alojamiento.tipo],
            ["Precio por noche", "$" + alojamiento.precioNoche],
            ["Capacidad", alojamiento.capacidad + " personas"],
            ["Ambientes", alojamiento.cantAmbientes],
            ["Habitaciones", alojamiento.cantHabitaciones],
            ["Camas", alojamiento.cantCamas],
            ["Banios", alojamiento.cantBanios],
            ["Direccion", dir ? `${dir.calle} ${dir.altura}, ${dir.ciudad}, ${dir.provincia}, ${dir.pais}` : "-"],
            ["Anfitrion", alojamiento.anfitrion ? alojamiento.anfitrion.nombre : "-"],
            ["Descripcion", alojamiento.descripcion || "-"],
            ["Estado", alojamiento.activo ? (alojamiento.publicado ? "Publicado" : "Sin publicar") : "Dado de baja"]
        ];

        if (alojamiento.tipo === "CASA") {
            filas.push(["Patio", alojamiento.tienePatio ? "Si" : "No"]);
            filas.push(["Pileta", alojamiento.tienePileta ? "Si" : "No"]);
            filas.push(["Parrilla", alojamiento.tieneParrilla ? "Si" : "No"]);
        } else if (alojamiento.tipo === "HOTEL") {
            filas.push(["Estrellas", alojamiento.estrellas]);
            filas.push(["Desayuno incluido", alojamiento.incluyeDesayuno ? "Si" : "No"]);
            filas.push(["Limpieza incluida", alojamiento.incluyeLimpieza ? "Si" : "No"]);
        } else if (alojamiento.tipo === "DEPARTAMENTO") {
            filas.push(["Piso", alojamiento.piso]);
            filas.push(["Ascensor", alojamiento.tieneAscensor ? "Si" : "No"]);
            filas.push(["Expensas incluidas", alojamiento.expensasIncluidas ? "Si" : "No"]);
        }

        document.getElementById("datos").innerHTML = filas.map(([e, v]) => `<dt>${e}</dt><dd>${v ?? "-"}</dd>`).join("");

        document.getElementById("amenities").innerHTML = (alojamiento.amenities || []).map(a => `<li>${a.nombre}</li>`).join("") || "<li>Sin amenities cargados</li>";

        const acciones = document.getElementById("acciones");
        const esDueno = usuario.tipoUsuario === "ANFITRION" && alojamiento.anfitrion && alojamiento.anfitrion.id === usuario.id;

        if (usuario.tipoUsuario === "CLIENTE") {
            acciones.innerHTML = `<a href="/registrar-reserva.html?idAlojamiento=${id}">Solicitar reserva</a>`;
        } else if (esDueno || usuario.tipoUsuario === "ADMINISTRADOR") {
            let html = `<a href="/actualizar-${alojamiento.tipo.toLowerCase()}.html?id=${id}">Editar</a>
                | <a href="/editar-galeria.html?id=${id}">Galeria</a>
                | <button onclick="eliminar()">Dar de baja</button>`;
            if (esDueno && !alojamiento.publicado) {
                html += ` | <button onclick="publicar()">Publicar</button>`;
            }
            acciones.innerHTML = html;
        }
    }

    async function eliminar() {
        if (!confirm("Dar de baja este alojamiento?")) return;
        await apiFetch(`/${alojamiento.tipo.charAt(0) + alojamiento.tipo.slice(1).toLowerCase()}/eliminar/${id}`, { method: "DELETE" });
        window.location.href = "/listar-alojamientos.html";
    }

    async function publicar() {
        try {
            const respuesta = await apiFetch(`/Alojamiento/${id}/publicar`, { method: "PATCH" });
            if (!respuesta.ok) throw new Error(await respuesta.text());
            cargar();
        } catch (e) {
            alert("No se pudo publicar: " + e.message);
        }
    }

    async function cargarGaleria() {
        try {
            const gallery = await apiJson("/gallery/alojamiento/" + id);
            const imagenes = await apiJson(`/gallery/${gallery.id}/images`);
            document.getElementById("galeria").innerHTML = imagenes.map(img => `<img src="${img.url}" alt="${img.alt || ""}">`).join("") || "Sin fotos";
        } catch (e) {
            document.getElementById("galeria").textContent = "Sin fotos";
        }
    }

    async function cargarReviews() {
        const reviews = await apiJson("/Review/alojamiento/" + id);
        document.getElementById("reviews").innerHTML = reviews.map(r => `
            <div class="review">
                <strong>${r.cliente ? r.cliente.nombre : "Usuario"}</strong> - ${"*".repeat(r.puntuacion)}${"-".repeat(5 - r.puntuacion)}
                <br>${r.comentario}
            </div>
        `).join("") || "<p>Sin reviews todavia.</p>";
    }

    cargar().then(() => { cargarGaleria(); cargarReviews(); });
</script>
</body>
</html>
