<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar hotel</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 8px; }
        fieldset { display: flex; flex-wrap: wrap; gap: 8px; }
        label.chk { display: flex; align-items: center; gap: 4px; font-weight: normal; }
    </style>
</head>
<body>
<p><a href="/listar-alojamientos.html">Volver al listado</a></p>
<h1>Registrar hotel</h1>

<form id="formHotel">
    <label for="titulo">Titulo</label>
    <input type="text" id="titulo" required>

    <label for="descripcion">Descripcion</label>
    <textarea id="descripcion" required></textarea>

    <label for="precioNoche">Precio por noche</label>
    <input type="number" id="precioNoche" min="1" required>

    <label for="capacidad">Capacidad</label>
    <input type="number" id="capacidad" min="1" required>

    <label for="cantAmbientes">Ambientes</label>
    <input type="number" id="cantAmbientes" min="1" required>

    <label for="cantHabitaciones">Habitaciones</label>
    <input type="number" id="cantHabitaciones" min="0" required>

    <label for="cantCamas">Camas</label>
    <input type="number" id="cantCamas" min="0" required>

    <label for="cantBanios">Banios</label>
    <input type="number" id="cantBanios" min="0" required>

    <label for="estrellas">Estrellas</label>
    <input type="number" id="estrellas" min="0" max="5" required>

    <label class="chk"><input type="checkbox" id="incluyeDesayuno"> Incluye desayuno</label>
    <label class="chk"><input type="checkbox" id="incluyeLimpieza"> Incluye limpieza</label>

    <label for="pais">Pais</label>
    <input type="text" id="pais" required>
    <label for="provincia">Provincia</label>
    <input type="text" id="provincia" required>
    <label for="ciudad">Ciudad</label>
    <input type="text" id="ciudad" required>
    <label for="codigoPostal">Codigo postal</label>
    <input type="text" id="codigoPostal" required>
    <label for="calle">Calle</label>
    <input type="text" id="calle" required>
    <label for="altura">Altura</label>
    <input type="number" id="altura" min="0" required>

    <label>Amenities</label>
    <fieldset id="amenities">Cargando...</fieldset>

    <button type="submit">Publicar hotel</button>
</form>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    let idAnfitrion = null;
    apiJson("/Usuario/me").then(u => idAnfitrion = u.id);

    apiJson("/Amenity/listar").then(lista => {
        document.getElementById("amenities").innerHTML = lista.map(a =>
            `<label class="chk"><input type="checkbox" value="${a.id}" class="amenity"> ${a.nombre}</label>`
        ).join("");
    });

    document.getElementById("formHotel").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = "";

        const amenityIds = Array.from(document.querySelectorAll(".amenity:checked")).map(c => Number(c.value));

        const datos = {
            idAnfitrion,
            titulo: document.getElementById("titulo").value,
            descripcion: document.getElementById("descripcion").value,
            precioNoche: parseFloat(document.getElementById("precioNoche").value),
            capacidad: parseInt(document.getElementById("capacidad").value),
            cantAmbientes: parseInt(document.getElementById("cantAmbientes").value),
            cantHabitaciones: parseInt(document.getElementById("cantHabitaciones").value),
            cantCamas: parseInt(document.getElementById("cantCamas").value),
            cantBanios: parseInt(document.getElementById("cantBanios").value),
            estrellas: parseInt(document.getElementById("estrellas").value),
            incluyeDesayuno: document.getElementById("incluyeDesayuno").checked,
            incluyeLimpieza: document.getElementById("incluyeLimpieza").checked,
            pais: document.getElementById("pais").value,
            provincia: document.getElementById("provincia").value,
            ciudad: document.getElementById("ciudad").value,
            codigoPostal: document.getElementById("codigoPostal").value,
            calle: document.getElementById("calle").value,
            altura: parseInt(document.getElementById("altura").value),
            amenityIds
        };

        try {
            const hotel = await apiJson("/Hotel/registrar", "POST", datos);
            const gallery = await apiJson("/gallery/alojamiento/" + hotel.id);
            window.location.href = `/upload-galeria.html?galleryId=${gallery.id}&idAlojamiento=${hotel.id}`;
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
