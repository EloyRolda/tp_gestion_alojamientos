<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        form { display: flex; flex-direction: column; gap: 10px; width: 280px; }
        #mensaje { display: none; }
        #mensaje.error { color: red; }
        #mensaje.exito { color: green; }
    </style>
</head>
<body>
<form id="formRegistro">
    <h1>Crear cuenta</h1>
    <p id="mensaje"></p>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Contrasena</label>
    <input type="password" id="password" required minlength="6">

    <label for="telefono">Telefono</label>
    <input type="tel" id="telefono" required>

    <label for="tipoUsuario">Tipo de cuenta</label>
    <select id="tipoUsuario" required>
        <option value="CLIENTE">Cliente</option>
        <option value="ANFITRION">Anfitrion</option>
    </select>

    <div id="campoMetodoPago">
        <label for="metodoPago">Metodo de pago preferido</label>
        <input type="text" id="metodoPago" placeholder="Ej: tarjeta, transferencia">
    </div>

    <button type="submit" id="btnRegistrar">Crear cuenta</button>
    <a href="/login.html">Ya tengo cuenta</a>
</form>

<script>
    const tipoUsuario = document.getElementById("tipoUsuario");
    const campoMetodoPago = document.getElementById("campoMetodoPago");

    function actualizarCampoPago() {
        campoMetodoPago.style.display = tipoUsuario.value === "CLIENTE" ? "block" : "none";
    }
    tipoUsuario.addEventListener("change", actualizarCampoPago);
    actualizarCampoPago();

    document.getElementById("formRegistro").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const boton = document.getElementById("btnRegistrar");
        const mensaje = document.getElementById("mensaje");

        const datos = {
            nombre: document.getElementById("nombre").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            telefono: document.getElementById("telefono").value,
            tipoUsuario: tipoUsuario.value,
            metodoPago: tipoUsuario.value === "CLIENTE" ? document.getElementById("metodoPago").value : null
        };

        boton.disabled = true;
        mensaje.style.display = "none";

        try {
            const respuesta = await fetch("/Usuario/registrar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });
            const texto = await respuesta.text();

            if (!respuesta.ok) {
                throw new Error(texto);
            }

            mensaje.className = "exito";
            mensaje.textContent = "Cuenta creada. Redirigiendo al login...";
            mensaje.style.display = "block";
            setTimeout(() => window.location.href = "/login.html", 1500);
        } catch (e) {
            mensaje.className = "error";
            mensaje.textContent = e.message;
            mensaje.style.display = "block";
            boton.disabled = false;
        }
    });
</script>
</body>
</html>
