<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
        dt { font-weight: bold; margin-top: 8px; }
    </style>
</head>
<body>
<p><a href="/home.html">Volver al panel</a></p>
<h1>Mi perfil</h1>

<img id="foto" src="" alt="Foto de perfil" style="display:none">
<form id="formFoto">
    <label for="archivoFoto">Cambiar foto de perfil</label><br>
    <input type="file" id="archivoFoto" accept="image/*" required>
    <button type="submit">Subir</button>
</form>
<p id="mensajeFoto"></p>

<dl id="datos"></dl>

<p><a href="/actualizar-perfil.html">Editar mis datos</a></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();

    async function cargarPerfil() {
        const usuario = await apiJson("/Usuario/me");

        if (usuario.fotoUrl) {
            const img = document.getElementById("foto");
            img.src = usuario.fotoUrl;
            img.style.display = "block";
        }

        const datos = document.getElementById("datos");
        const filas = [
            ["Nombre", usuario.nombre],
            ["Email", usuario.email],
            ["Telefono", usuario.telefono],
            ["Rol", usuario.tipoUsuario],
            ["Estado", usuario.activo ? "Activo" : "Inactivo"]
        ];
        if (usuario.tipoUsuario === "CLIENTE") filas.push(["Metodo de pago", usuario.metodo_pago || "-"]);
        if (usuario.tipoUsuario === "ADMINISTRADOR") filas.push(["Matricula", usuario.matricula || "-"]);

        datos.innerHTML = filas.map(([etiqueta, valor]) => `<dt>${etiqueta}</dt><dd>${valor ?? "-"}</dd>`).join("");
    }
    cargarPerfil();

    document.getElementById("formFoto").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mensaje = document.getElementById("mensajeFoto");
        const archivo = document.getElementById("archivoFoto").files[0];

        const formData = new FormData();
        formData.append("file", archivo);

        try {
            const respuesta = await apiFetch("/Usuario/foto", { method: "POST", body: formData });
            if (!respuesta.ok) throw new Error(await respuesta.text());
            mensaje.textContent = "Foto actualizada.";
            cargarPerfil();
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
