<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar galeria</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        .foto { display: inline-block; margin: 4px; text-align: center; }
        img { width: 100px; height: 100px; object-fit: cover; display: block; }
    </style>
</head>
<body>
<p><a id="linkVolver" href="/listar-alojamientos.html">Volver al alojamiento</a></p>
<h1>Editar galeria</h1>

<div id="galeria"></div>

<h2>Agregar fotos</h2>
<input type="file" id="archivos" accept="image/*" multiple>
<button id="btnSubir">Subir</button>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    const idAloj = new URLSearchParams(location.search).get("id");
    if (!idAloj) window.location.href = "/listar-alojamientos.html";
    document.getElementById("linkVolver").href = `/detalle-alojamiento.html?id=${idAloj}`;

    let galleryId = null;

    async function cargar() {
        const gallery = await apiJson("/gallery/alojamiento/" + idAloj);
        galleryId = gallery.id;
        const imagenes = await apiJson(`/gallery/${galleryId}/images`);
        document.getElementById("galeria").innerHTML = imagenes.map(img => `
            <div class="foto">
                <img src="${img.url}" alt="${img.alt || ""}">
                <button onclick="eliminarImagen(${img.id})">Eliminar</button>
            </div>
        `).join("") || "<p>Sin fotos todavia.</p>";
    }
    cargar();

    async function eliminarImagen(idImagen) {
        if (!confirm("Eliminar esta foto?")) return;
        await apiFetch("/gallery/delete/" + idImagen, { method: "DELETE" });
        cargar();
    }

    document.getElementById("btnSubir").addEventListener("click", async () => {
        const mensaje = document.getElementById("mensaje");
        const archivos = document.getElementById("archivos").files;
        if (archivos.length === 0) {
            mensaje.textContent = "Elegi al menos una foto.";
            return;
        }
        let exitosas = 0;
        for (const archivo of archivos) {
            const formData = new FormData();
            formData.append("file", archivo);
            formData.append("alt", archivo.name);
            formData.append("galleryId", galleryId);
            try {
                const respuesta = await apiFetch("/gallery/upload", { method: "POST", body: formData });
                if (respuesta.ok) exitosas++;
            } catch (e) { }
        }
        mensaje.textContent = `${exitosas} de ${archivos.length} fotos subidas.`;
        cargar();
    });
</script>
</body>
</html>
