<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar departamento</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 8px; }
        fieldset { display: flex; flex-wrap: wrap; gap: 8px; }
        label.chk { display: flex; align-items: center; gap: 4px; font-weight: normal; }
    </style>
</head>
<body>
<p><a href="/listar-alojamientos.html">Volver al listado</a></p>
<h1>Editar departamento</h1>
<p>Dejar en blanco lo que no se quiera cambiar.</p>

<form id="formDepto">
    <label for="titulo">Titulo</label>
    <input type="text" id="titulo">
    <label for="descripcion">Descripcion</label>
    <textarea id="descripcion"></textarea>
    <label for="precioNoche">Precio por noche</label>
    <input type="number" id="precioNoche" min="1">
    <label for="capacidad">Capacidad</label>
    <input type="number" id="capacidad" min="1">
    <label for="cantAmbientes">Ambientes</label>
    <input type="number" id="cantAmbientes" min="1">
    <label for="cantHabitaciones">Habitaciones</label>
    <input type="number" id="cantHabitaciones" min="0">
    <label for="cantCamas">Camas</label>
    <input type="number" id="cantCamas" min="0">
    <label for="cantBanios">Banios</label>
    <input type="number" id="cantBanios" min="0">
    <label for="piso">Piso</label>
    <input type="number" id="piso">

    <label class="chk"><input type="checkbox" id="tieneAscensor"> Ascensor</label>
    <label class="chk"><input type="checkbox" id="expensasIncluidas"> Expensas incluidas</label>

    <label for="pais">Pais</label>
    <input type="text" id="pais">
    <label for="provincia">Provincia</label>
    <input type="text" id="provincia">
    <label for="ciudad">Ciudad</label>
    <input type="text" id="ciudad">
    <label for="codigoPostal">Codigo postal</label>
    <input type="text" id="codigoPostal">
    <label for="calle">Calle</label>
    <input type="text" id="calle">
    <label for="altura">Altura</label>
    <input type="number" id="altura" min="0">

    <label>Amenities (se reemplaza la lista completa si se toca algo)</label>
    <fieldset id="amenities">Cargando...</fieldset>

    <label for="activo">Estado</label>
    <select id="activo">
        <option value="">Sin cambios</option>
        <option value="true">Activo</option>
        <option value="false">Dado de baja</option>
    </select>

    <button type="submit">Guardar cambios</button>
</form>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    const id = new URLSearchParams(location.search).get("id");

    async function cargar() {
        const depto = await apiJson("/Departamento/mostrar/" + id);
        const amenitiesDisponibles = await apiJson("/Amenity/listar");
        const actuales = (depto.amenities || []).map(a => a.id);

        document.getElementById("amenities").innerHTML = amenitiesDisponibles.map(a =>
            `<label class="chk"><input type="checkbox" value="${a.id}" class="amenity" ${actuales.includes(a.id) ? "checked" : ""}> ${a.nombre}</label>`
        ).join("");
    }
    cargar();

    document.getElementById("formDepto").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = "";

        const datos = { id: Number(id) };
        const campo = (elId, campoDto, parser = v => v) => {
            const valor = document.getElementById(elId).value;
            if (valor !== "") datos[campoDto] = parser(valor);
        };

        campo("titulo", "titulo");
        campo("descripcion", "descripcion");
        campo("precioNoche", "precioNoche", parseFloat);
        campo("capacidad", "capacidad", parseInt);
        campo("cantAmbientes", "cantAmbientes", parseInt);
        campo("cantHabitaciones", "cantHabitaciones", parseInt);
        campo("cantCamas", "cantCamas", parseInt);
        campo("cantBanios", "cantBanios", parseInt);
        campo("piso", "piso", parseInt);
        campo("pais", "pais");
        campo("provincia", "provincia");
        campo("ciudad", "ciudad");
        campo("codigoPostal", "codigoPostal");
        campo("calle", "calle");
        campo("altura", "altura", parseInt);

        datos.tieneAscensor = document.getElementById("tieneAscensor").checked;
        datos.expensasIncluidas = document.getElementById("expensasIncluidas").checked;
        datos.amenityIds = Array.from(document.querySelectorAll(".amenity:checked")).map(c => Number(c.value));

        const activo = document.getElementById("activo").value;
        if (activo) datos.activo = activo === "true";

        try {
            await apiJson("/Departamento/actualizar", "PUT", datos);
            mensaje.textContent = "Departamento actualizado.";
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
