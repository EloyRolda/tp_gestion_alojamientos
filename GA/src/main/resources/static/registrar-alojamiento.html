<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar alojamiento</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 8px; }
        fieldset { display: flex; flex-wrap: wrap; gap: 8px; }
        label.chk { display: flex; align-items: center; gap: 4px; font-weight: normal; }
    </style>
</head>
<body>
<p><a href="/listar-alojamientos.html">Volver al listado</a></p>
<h1>Registrar alojamiento</h1>

<form id="formAlojamiento">
    <label for="tipo">Tipo</label>
    <select id="tipo" required>
        <option value="CASA">Casa</option>
        <option value="DEPARTAMENTO">Departamento</option>
        <option value="HOTEL">Hotel</option>
    </select>

    <label for="titulo">Titulo</label>
    <input type="text" id="titulo" required>

    <label for="descripcion">Descripcion</label>
    <textarea id="descripcion" required></textarea>

    <label for="precioNoche">Precio por noche</label>
    <input type="number" id="precioNoche" min="1" required>

    <label for="capacidad">Capacidad</label>
    <input type="number" id="capacidad" min="1" required>

    <label for="cantAmbientes">Ambientes</label>
    <input type="number" id="cantAmbientes" min="1" required>

    <label for="cantHabitaciones">Habitaciones</label>
    <input type="number" id="cantHabitaciones" min="0" required>

    <label for="cantCamas">Camas</label>
    <input type="number" id="cantCamas" min="0" required>

    <label for="cantBanios">Banios</label>
    <input type="number" id="cantBanios" min="0" required>

    <div id="campoPiso">
        <label for="piso">Piso</label>
        <input type="number" id="piso">
    </div>

    <div id="campoEstrellas">
        <label for="estrellas">Estrellas</label>
        <input type="number" id="estrellas" min="0" max="5">
    </div>

    <label for="pais">Pais</label>
    <input type="text" id="pais" required>
    <label for="provincia">Provincia</label>
    <input type="text" id="provincia" required>
    <label for="ciudad">Ciudad</label>
    <input type="text" id="ciudad" required>
    <label for="codigoPostal">Codigo postal</label>
    <input type="text" id="codigoPostal" required>
    <label for="calle">Calle</label>
    <input type="text" id="calle" required>
    <label for="altura">Altura</label>
    <input type="number" id="altura" min="0" required>

    <label>Amenities</label>
    <fieldset id="amenities">Cargando...</fieldset>

    <button type="submit" id="btnSubmit" disabled>Publicar alojamiento</button>
</form>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    let idAnfitrion = null;

    const tipoPreseleccionado = new URLSearchParams(location.search).get("tipo");
    if (tipoPreseleccionado) document.getElementById("tipo").value = tipoPreseleccionado;

    apiJson("/Usuario/me").then(u => {
        idAnfitrion = u.id;
        document.getElementById("btnSubmit").disabled = false;
    });

    apiJson("/Amenity/listar").then(lista => {
        document.getElementById("amenities").innerHTML = lista.map(a =>
            `<label class="chk"><input type="checkbox" value="${a.id}" class="amenity"> ${a.nombre}</label>`
        ).join("");
    });

    function actualizarCamposPorTipo() {
        const tipo = document.getElementById("tipo").value;
        document.getElementById("campoPiso").style.display = tipo === "DEPARTAMENTO" ? "block" : "none";
        document.getElementById("campoEstrellas").style.display = tipo === "HOTEL" ? "block" : "none";
        document.getElementById("piso").required = tipo === "DEPARTAMENTO";
        document.getElementById("estrellas").required = tipo === "HOTEL";
    }
    document.getElementById("tipo").addEventListener("change", actualizarCamposPorTipo);
    actualizarCamposPorTipo();

    document.getElementById("formAlojamiento").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = "";

        const tipo = document.getElementById("tipo").value;
        const amenityIds = Array.from(document.querySelectorAll(".amenity:checked")).map(c => Number(c.value));

        const datos = {
            idAnfitrion,
            tipo,
            titulo: document.getElementById("titulo").value,
            descripcion: document.getElementById("descripcion").value,
            precioNoche: parseFloat(document.getElementById("precioNoche").value),
            capacidad: parseInt(document.getElementById("capacidad").value),
            cantAmbientes: parseInt(document.getElementById("cantAmbientes").value),
            cantHabitaciones: parseInt(document.getElementById("cantHabitaciones").value),
            cantCamas: parseInt(document.getElementById("cantCamas").value),
            cantBanios: parseInt(document.getElementById("cantBanios").value),
            piso: tipo === "DEPARTAMENTO" ? parseInt(document.getElementById("piso").value) : null,
            estrellas: tipo === "HOTEL" ? parseInt(document.getElementById("estrellas").value) : null,
            pais: document.getElementById("pais").value,
            provincia: document.getElementById("provincia").value,
            ciudad: document.getElementById("ciudad").value,
            codigoPostal: document.getElementById("codigoPostal").value,
            calle: document.getElementById("calle").value,
            altura: parseInt(document.getElementById("altura").value),
            amenityIds
        };

        try {
            const alojamiento = await apiJson("/Alojamiento/registrar", "POST", datos);
            const gallery = await apiJson("/gallery/alojamiento/" + alojamiento.id);
            window.location.href = `/upload-galeria.html?galleryId=${gallery.id}&idAlojamiento=${alojamiento.id}`;
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
