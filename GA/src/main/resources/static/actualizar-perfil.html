<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar mi perfil</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 0 auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
<p><a href="/mi-perfil.html">Volver a mi perfil</a></p>
<h1>Editar mi perfil</h1>
<p>Dejar en blanco los campos que no querés cambiar.</p>

<form id="formEditar">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre">

    <label for="email">Email</label>
    <input type="email" id="email">

    <label for="password">Nueva contrasena</label>
    <input type="password" id="password" minlength="6">

    <label for="telefono">Telefono</label>
    <input type="text" id="telefono">

    <label for="metodoPago">Metodo de pago</label>
    <input type="text" id="metodoPago">

    <button type="submit">Guardar cambios</button>
</form>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();

    document.getElementById("formEditar").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = "";

        const datos = {};
        const nombre = document.getElementById("nombre").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const telefono = document.getElementById("telefono").value.trim();
        const metodoPago = document.getElementById("metodoPago").value.trim();

        if (nombre) datos.nombre = nombre;
        if (email) datos.email = email;
        if (password) datos.password = password;
        if (telefono) datos.telefono = telefono;
        if (metodoPago) datos.metodoPago = metodoPago;

        if (Object.keys(datos).length === 0) {
            mensaje.textContent = "Completa al menos un campo.";
            return;
        }

        try {
            await apiJson("/Usuario/actualizar", "PUT", datos);
            mensaje.textContent = "Perfil actualizado.";
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
