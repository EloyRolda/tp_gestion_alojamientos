<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis estadisticas</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        dt { font-weight: bold; margin-top: 8px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 4px 8px; font-size: 13px; }
    </style>
</head>
<body>
<p><a href="/home.html">Volver al panel</a></p>
<h1>Mis estadisticas</h1>
<dl id="datos"></dl>

<h2>Ingresos por mes</h2>
<table>
    <thead><tr><th>Mes</th><th>Ingresos</th><th>Reservas</th></tr></thead>
    <tbody id="tbody"></tbody>
</table>

<script src="/js/api.js"></script>
<script>
    requireLogin();

    apiJson("/Estadisticas/anfitrion").then(e => {
        document.getElementById("datos").innerHTML = `
            <dt>Alojamientos</dt><dd>${e.cantidadAlojamientos}</dd>
            <dt>Reservas totales</dt><dd>${e.cantidadReservasTotales}</dd>
            <dt>Estadias finalizadas</dt><dd>${e.cantidadReservasFinalizadas}</dd>
            <dt>Ingresos totales</dt><dd>$${e.ingresosTotales}</dd>
            <dt>Promedio de noches por estadia</dt><dd>${e.promedioNochesPorEstadia.toFixed(1)}</dd>
            <dt>Tasa de aceptacion</dt><dd>${e.tasaDeAceptacionPorcentaje.toFixed(1)}%</dd>
            <dt>Calificacion promedio</dt><dd>${e.calificacionPromedio.toFixed(1)} / 5</dd>
        `;
        document.getElementById("tbody").innerHTML = e.ingresosPorMes.map(m =>
            `<tr><td>${m.mes}</td><td>$${m.ingresos}</td><td>${m.cantidadReservas}</td></tr>`
        ).join("") || "<tr><td colspan='3'>Sin datos todavia</td></tr>";
    });
</script>
</body>
</html>
