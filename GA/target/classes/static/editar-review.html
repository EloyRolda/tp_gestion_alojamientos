<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar review</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 0 auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>
<p><a href="/mis-reviews.html">Volver a mis reviews</a></p>
<h1>Editar review</h1>
<p>Solo se puede editar dentro de las 48hs de haberla creado.</p>

<form id="formEditar">
    <label for="puntuacion">Puntuacion (0 a 5)</label>
    <input type="number" id="puntuacion" min="0" max="5" required>

    <label for="comentario">Comentario</label>
    <textarea id="comentario" required maxlength="2000"></textarea>

    <button type="submit">Guardar cambios</button>
</form>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    const id = new URLSearchParams(location.search).get("id");

    async function cargar() {
        const review = await apiJson("/Review/mostrar/" + id);
        document.getElementById("puntuacion").value = review.puntuacion;
        document.getElementById("comentario").value = review.comentario;
    }
    cargar();

    document.getElementById("formEditar").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const mensaje = document.getElementById("mensaje");
        try {
            await apiJson("/Review/actualizar", "PUT", {
                id: Number(id),
                puntuacion: parseInt(document.getElementById("puntuacion").value),
                comentario: document.getElementById("comentario").value
            });
            mensaje.textContent = "Review actualizada.";
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
