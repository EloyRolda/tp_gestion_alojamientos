<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis reservas</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; }
        .reserva { border: 1px solid #ccc; padding: 10px; margin-bottom: 8px; }
    </style>
</head>
<body>
<p><a href="/home.html">Volver al panel</a></p>
<h1>Mis reservas</h1>

<div id="lista"></div>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();

    async function cargar() {
        const mensaje = document.getElementById("mensaje");
        try {
            const reservas = await apiJson("/Reserva/listar/propios");
            mostrar(reservas);
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    }

    function mostrar(reservas) {
        const lista = document.getElementById("lista");
        if (reservas.length === 0) {
            lista.innerHTML = "<p>No tenes reservas todavia.</p>";
            return;
        }

        lista.innerHTML = reservas.map(r => {
            const acciones = [];
            acciones.push(`<a href="/detalle-alojamiento.html?id=${r.alojamiento.id}">Ver alojamiento</a>`);

            if (r.estado === "SOLICITADA" || r.estado === "ACEPTADA") {
                acciones.push(`<button onclick="cancelar(${r.id})">Cancelar</button>`);
            }
            if (r.estado === "ACEPTADA") {
                acciones.push(`<a href="/pagar-reserva.html?id=${r.id}">Pagar ahora</a>`);
            }
            if (r.estado === "PAGADA") {
                acciones.push(`<a href="/mis-chats.html">Ir al chat</a>`);
            }
            if (r.estado === "FINALIZADA") {
                acciones.push(`<a href="/registrar-review.html?idReserva=${r.id}">Dejar review</a>`);
            }

            return `<div class="reserva">
                <strong>Reserva #${r.id}</strong> - ${r.alojamiento.titulo} - <em>${r.estado}</em><br>
                ${r.fechaInicio} a ${r.fechaFin} - ${r.cantidadPersonas} personas - $${r.precioTotal}
                ${r.motivoRechazo ? `<br>Motivo de rechazo: ${r.motivoRechazo}` : ""}
                ${r.estado === "ACEPTADA" && r.fechaLimitePago ? `<br>Pagar antes de: ${r.fechaLimitePago}` : ""}
                <br>${acciones.join(" | ")}
            </div>`;
        }).join("");
    }

    async function cancelar(id) {
        if (!confirm("Cancelar esta reserva?")) return;
        try {
            await apiJson(`/Reserva/${id}/cancelar`, "PATCH");
            cargar();
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    cargar();
</script>
</body>
</html>
