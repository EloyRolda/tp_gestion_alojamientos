<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; }
        #mensajes { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 8px; margin-bottom: 8px; }
        .propio { text-align: right; }
        form { display: flex; gap: 6px; }
        input[type=text] { flex: 1; }
    </style>
</head>
<body>
<p><a href="/mis-chats.html">Volver a mis chats</a></p>
<h1>Chat</h1>
<div id="mensajes"></div>
<form id="formEnviar">
    <input type="text" id="contenido" maxlength="2000" required>
    <button type="submit">Enviar</button>
</form>
<p id="mensajeEstado"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    const idChat = new URLSearchParams(location.search).get("id");
    let usuario = null;

    function pintar(mensajes) {
        document.getElementById("mensajes").innerHTML = mensajes.map(m => `
            <div class="${usuario && m.remitente.id === usuario.id ? "propio" : ""}">
                <strong>${m.remitente.nombre}:</strong> ${m.contenido}
            </div>
        `).join("");
        const contenedor = document.getElementById("mensajes");
        contenedor.scrollTop = contenedor.scrollHeight;
    }

    async function cargar() {
        usuario = await apiJson("/Usuario/me");
        const mensajes = await apiJson(`/Chat/${idChat}/mensajes`);
        pintar(mensajes);
    }
    cargar();

    // Actualiza cada 4 segundos (alternativa simple a mantener abierto un socket).
    setInterval(cargar, 4000);

    document.getElementById("formEnviar").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const input = document.getElementById("contenido");
        const mensajeEstado = document.getElementById("mensajeEstado");
        try {
            await apiJson(`/Chat/${idChat}/mensajes`, "POST", { contenido: input.value });
            input.value = "";
            cargar();
        } catch (e) {
            mensajeEstado.textContent = "Error: " + e.message;
        }
    });
</script>
</body>
</html>
