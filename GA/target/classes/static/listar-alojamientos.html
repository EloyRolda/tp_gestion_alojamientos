<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alojamientos</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; font-size: 14px; }
        #filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    </style>
</head>
<body>
<p><a href="/home.html">Volver al panel</a></p>
<h1 id="titulo">Alojamientos</h1>

<div id="filtros">
    <input type="text" id="fCiudad" placeholder="Ciudad">
    <select id="fTipo">
        <option value="">Cualquier tipo</option>
        <option value="CASA">Casa</option>
        <option value="DEPARTAMENTO">Departamento</option>
        <option value="HOTEL">Hotel</option>
    </select>
    <input type="number" id="fCapacidad" placeholder="Capacidad minima" min="1">
    <input type="number" id="fPrecioMin" placeholder="Precio min" min="0">
    <input type="number" id="fPrecioMax" placeholder="Precio max" min="0">
    <button id="btnBuscar">Buscar</button>
</div>

<p><a href="/registrar-alojamiento.html?tipo=CASA">+ Registrar casa</a> | <a href="/registrar-alojamiento.html?tipo=DEPARTAMENTO">+ Registrar departamento</a> | <a href="/registrar-alojamiento.html?tipo=HOTEL">+ Registrar hotel</a></p>

<table>
    <thead>
    <tr><th>Titulo</th><th>Tipo</th><th>Precio/noche</th><th>Capacidad</th><th>Ciudad</th><th>Anfitrion</th><th>Estado</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
</table>
<p id="mensaje"></p>

<script src="/js/api.js"></script>
<script>
    requireLogin();
    const esPropios = new URLSearchParams(location.search).get("propios") === "true";
    document.getElementById("titulo").textContent = esPropios ? "Mis alojamientos" : "Alojamientos";
    document.getElementById("filtros").style.display = esPropios ? "none" : "flex";

    let usuarioActual = null;

    async function cargar() {
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = "";
        try {
            usuarioActual = await apiJson("/Usuario/me");
            let lista;

            if (esPropios) {
                lista = await apiJson("/Alojamiento/listar/propios");
            } else {
                const params = new URLSearchParams();
                const ciudad = document.getElementById("fCiudad").value.trim();
                const tipo = document.getElementById("fTipo").value;
                const capacidad = document.getElementById("fCapacidad").value;
                const precioMin = document.getElementById("fPrecioMin").value;
                const precioMax = document.getElementById("fPrecioMax").value;
                if (ciudad) params.set("ciudad", ciudad);
                if (tipo) params.set("tipo", tipo);
                if (capacidad) params.set("capacidadMinima", capacidad);
                if (precioMin) params.set("precioMin", precioMin);
                if (precioMax) params.set("precioMax", precioMax);
                lista = await apiJson("/Alojamiento/buscar?" + params.toString());
            }
            renderizar(lista);
        } catch (e) {
            mensaje.textContent = "Error: " + e.message;
        }
    }

    function renderizar(lista) {
        document.getElementById("tbody").innerHTML = lista.map(a => {
            const ciudad = a.direccion ? a.direccion.ciudad : "-";
            const anfitrion = a.anfitrion ? a.anfitrion.nombre : "-";
            const puedeEditar = usuarioActual.tipoUsuario === "ADMINISTRADOR" ||
                (usuarioActual.tipoUsuario === "ANFITRION" && a.anfitrion && a.anfitrion.id === usuarioActual.id);

            return `<tr>
                <td>${a.titulo}</td>
                <td>${a.tipo}</td>
                <td>$${a.precioNoche}</td>
                <td>${a.capacidad}</td>
                <td>${ciudad}</td>
                <td>${anfitrion}</td>
                <td>${a.activo ? (a.publicado ? "Publicado" : "Sin publicar") : "Dado de baja"}</td>
                <td>
                    <a href="/detalle-alojamiento.html?id=${a.id}&tipo=${a.tipo}">Ver</a>
                    ${puedeEditar ? ` | <a href="/actualizar-alojamiento.html?id=${a.id}">Editar</a>` : ""}
                </td>
            </tr>`;
        }).join("");
    }

    document.getElementById("btnBuscar").addEventListener("click", cargar);
    cargar();
</script>
</body>
</html>
