<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todos los chats</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .chat { border: 1px solid #ccc; padding: 8px; margin-bottom: 6px; }
    </style>
</head>
<body>
<p><a href="/home.html">Volver al panel</a></p>
<h1>Todos los chats (auditoria)</h1>
<div id="lista"></div>

<script src="/js/api.js"></script>
<script>
    requireLogin();

    apiJson("/Chat/listar").then(chats => {
        document.getElementById("lista").innerHTML = chats.map(c => `
            <div class="chat">
                Reserva #${c.reserva.id} - ${c.reserva.alojamiento.titulo}<br>
                Anfitrion: ${c.anfitrion.nombre} (${c.anfitrion.email})<br>
                Cliente: ${c.cliente.nombre} (${c.cliente.email})<br>
                Estado: ${c.activo ? "abierto" : "cerrado"}<br>
                <a href="/chat.html?id=${c.id}">Ver conversacion</a>
            </div>
        `).join("") || "<p>No hay chats todavia.</p>";
    });
</script>
</body>
</html>
