# BASE DE DATOS
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# LOGGING
logging.level.root=WARN
logging.level.com.tuapp=INFO
logging.file.name=logs/ga-app.log


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# MERCADO PAGO (conexion OAuth real del anfitrion; opcional mientras no tengas
# una app creada en https://www.mercadopago.com.ar/developers -- si quedan vacias,
# el modo alias manual sigue funcionando igual).
mercadopago.client-id=${MP_CLIENT_ID:}
mercadopago.client-secret=${MP_CLIENT_SECRET:}
mercadopago.redirect-uri=${MP_REDIRECT_URI:http://localhost:8080/MercadoPago/callback}